<!DOCTYPE html>
<html>
<head>
<title>The Blessed Hats</title>
<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:black;
  color:white;
}
.header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:12px;
  background: rgba(20,20,20,0.6);
  backdrop-filter: blur(10px);
}
.header img { height:40px; }
.header h1 { margin:0; font-size:20px; }
.container {
  max-width: 1000px;
  margin:auto;
  padding:20px;
}
.products {
  display:grid;
  grid-template-columns: repeat(2, 1fr);
  gap:20px;
}
.product-card {
  background: rgba(30,30,30,0.8);
  border-radius: 15px;
  padding: 10px;
  text-align:center;
  cursor:pointer;
  transition:0.3s;
}
.product-card img {
  width:100%;
  height:250px;
  object-fit:cover;
  border-radius:10px;
  margin-bottom:10px;
}
.product-card:hover {
  transform: scale(1.03);
}
.product-name { font-size:18px; margin-bottom:5px; }
.product-price { font-size:16px; font-weight:bold; color:#ffd700; }
</style>
</head>
<body>

<div class="header">
  <img src="logo.png" alt="Logo">
  <h1>The Blessed Hats</h1>
  <div class="cart" onclick="window.location.href='checkout.html'">🛒</div>
</div>

<div class="container">
  <div class="products">
    <div class="product-card" onclick="location.href='star.html'">
      <img src="star.png" alt="Star Cat">
      <div class="product-name">Star Cat</div>
      <div class="product-price">$850</div>
    </div>
    <div class="product-card" onclick="location.href='good.html'">
      <img src="good.png" alt="Good Demon">
      <div class="product-name">Good Demon</div>
      <div class="product-price">$850</div>
    </div>
    <div class="product-card" onclick="location.href='blessed.html'">
      <img src="blessed.png" alt="Blessed Bandit">
      <div class="product-name">Blessed Bandit</div>
      <div class="product-price">$850</div>
    </div>
    <div class="product-card" onclick="location.href='devil.html'">
      <img src="devil.png" alt="Devil Magic">
      <div class="product-name">Devil Magic</div>
      <div class="product-price">$900</div>
    </div>
  </div>
</div>

</body>
</html>
