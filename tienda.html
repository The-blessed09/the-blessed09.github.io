<!DOCTYPE html>
<html>
<head>
<title>The Blessed Hats</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
}

/* HEADER PREMIUM */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:10px 15px;
  background:#0a0a0a;
  border-bottom:1px solid #1f1f1f;
}

/* IZQUIERDA (LOGO + TEXTO) */
.left{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:35px;
  height:35px;
  object-fit:contain;
}

.brand{
  font-size:16px;
  font-weight:bold;
}

/* CARRITO */
.cart{
  font-size:20px;
  cursor:pointer;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
  padding:20px;
}

/* CARD */
.card{
  background:#0d0d0d;
  border-radius:18px;
  overflow:hidden;
  border:1px solid #1f1f1f;
  transition:0.2s;
}

.card:active{
  transform:scale(0.97);
}

/* IMAGE */
.card img{
  width:100%;
  height:160px;
  object-fit:contain;
  background:#111;
  padding:15px;
}

/* INFO */
.info{
  padding:15px;
  text-align:center;
}

.name{
  font-size:16px;
  margin-bottom:5px;
}

.price{
  font-size:15px;
  color:#ccc;
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">

  <div class="left">
    <img src="logo.png" class="logo">
    <div class="brand">The Blessed Hats</div>
  </div>

  <div class="cart">🛒</div>

</div>

<!-- PRODUCTOS -->
<div class="grid">

  <div class="card" onclick="location.href='star.html'">
    <img src="Star cat.png">
    <div class="info">
      <div class="name">Star Cat</div>
      <div class="price">$850 MXN</div>
    </div>
  </div>

  <div class="card" onclick="location.href='good.html'">
    <img src="Good.png">
    <div class="info">
      <div class="name">Good Demon</div>
      <div class="price">$850 MXN</div>
    </div>
  </div>

  <div class="card" onclick="location.href='devil.html'">
    <img src="gorra.png">
    <div class="info">
      <div class="name">Devil Magic</div>
      <div class="price">$900 MXN</div>
    </div>
  </div>

  <div class="card" onclick="location.href='blessed.html'">
    <img src="blessed.png">
    <div class="info">
      <div class="name">Blessed Bandit</div>
      <div class="price">$850 MXN</div>
    </div>
  </div>

</div>

</body>
  </html>
