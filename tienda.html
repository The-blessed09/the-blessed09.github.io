<!DOCTYPE html>
<html>
<head>
<title>The Blessed Hats</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
}

.header{
  text-align:center;
  padding:20px;
  font-size:24px;
  font-weight:bold;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:15px;
}

.card{
  background:#111;
  border-radius:15px;
  padding:10px;
  text-align:center;
  cursor:pointer;
}

.card img{
  width:100%;
  height:150px;
  object-fit:cover;
  border-radius:10px;
}

.price{
  margin-top:5px;
}
</style>
</head>

<body>

<div class="header">The Blessed Hats</div>

<div class="grid">

  <div class="card" onclick="location.href='star.html'">
    <img src="Star cat.png">
    <p>Star Cat</p>
    <div class="price">$850</div>
  </div>

  <div class="card" onclick="location.href='good.html'">
    <img src="Good.png">
    <p>Good Demon</p>
    <div class="price">$850</div>
  </div>

  <div class="card" onclick="location.href='devil.html'">
    <img src="gorra.png">
    <p>Devil Magic</p>
    <div class="price">$900</div>
  </div>

  <div class="card" onclick="location.href='blessed.html'">
    <img src="blessed.png">
    <p>Blessed Bandit</p>
    <div class="price">$850</div>
  </div>

</div>

</body>
</html>
