<!DOCTYPE html>
<html>
<head>
<title>The blessed hats</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
}

/* HEADER */
.header{
  background:black;
  padding:20px;
  font-size:24px;
  font-weight:bold;
}

/* GRID 2 COLUMNAS */
.grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:20px;
  padding:20px;
}

/* TARJETAS */
.card{
  background:#222;
  padding:15px;
  border-radius:20px;
  cursor:pointer;
  transition:0.3s;
  overflow:hidden;
}

.card:hover{
  transform:scale(1.05);
}

/* CONTENEDOR IMAGEN */
.img-container{
  width:100%;
  height:200px;
  overflow-x:auto;
  display:flex;
  scroll-snap-type:x mandatory;
}

.img-container img{
  width:100%;
  height:200px;
  object-fit:cover;
  flex-shrink:0;
  scroll-snap-align:center;
  border-radius:15px;
}

/* TEXTO */
.price{
  color:#ffd700;
  font-size:18px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">The blessed hats</div>

<div class="grid">

  <!-- ⭐ STAR CAT -->
  <div class="card" onclick="location.href='star.html'">
    
    <div class="img-container">
      <img src="star1.png">
      <img src="star2.png">
      <img src="star3.png">
      <img src="star4.png">
      <img src="star5.png">
    </div>

    <h2>Star cat</h2>
    <div class="price">$850 MXN</div>
  </div>


  <!-- 😈 EJEMPLO SEGUNDA GORRA (puedes activarla luego) -->
  <div class="card">
    
    <div class="img-container">
      <img src="Good.png">
    </div>

    <h2>Good Demon</h2>
    <div class="price">$850 MXN</div>
  </div>


</div>

</body>
</html>
