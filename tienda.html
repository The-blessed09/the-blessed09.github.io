<!DOCTYPE html>
<html>
<head>
<title>The blessed hats</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
  text-align:center;
}

/* HEADER */
.header{
  background:black;
  padding:20px;
  font-size:24px;
  font-weight:bold;
}

/* GRID */
.grid{
  display:flex;
  justify-content:center;
  padding:30px;
}

.card{
  background:#222;
  padding:15px;
  border-radius:20px;
  width:250px;
  cursor:pointer;
  transition:0.3s;
}

.card:hover{
  transform:scale(1.05);
}

.card img{
  width:100%;
  border-radius:15px;
}

.price{
  color:#ffd700;
  font-size:20px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="header">The blessed hats</div>

<div class="grid">

  <div class="card" onclick="location.href='star.html'">
    <img src="Star cat.png">
    <h2>Star cat</h2>
    <div class="price">$699 MXN</div>
  </div>

</div>

</body>
</html>
