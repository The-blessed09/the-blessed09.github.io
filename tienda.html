<!DOCTYPE html>
<html>
<head>
<title>The Blessed Hats</title>
<style>
body {margin:0;font-family:Arial;background:black;color:white;}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px;background: rgba(20,20,20,0.6);backdrop-filter: blur(10px);}
.header img{height:40px;}
.header h1{margin:0;font-size:20px;}
.cart{position:relative;font-size:22px;cursor:pointer;}
.cart-count{position:absolute;top:-5px;right:-8px;background:red;color:white;font-size:12px;padding:2px 6px;border-radius:50%;}
.cart-dropdown{display:none;position:absolute;right:0;top:40px;width:300px;background:rgba(30,30,30,0.9);backdrop-filter: blur(8px);border-radius:15px;padding:10px;z-index:100;}
.cart-item{display:flex;align-items:center;justify-content:space-between;padding:5px 0;border-bottom:1px solid #555;}
.cart-item img{height:40px;width:40px;object-fit:cover;border-radius:5px;margin-right:10px;}
.container{max-width:1000px;margin:auto;padding:20px;}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;}
.product-card{background: rgba(30,30,30,0.8);border-radius: 15px;padding: 10px;text-align:center;cursor:pointer;transition:0.3s;}
.product-card img{width:100%;height:200px;object-fit:contain;border-radius:10px;margin-bottom:10px;}
.product-card:hover{transform: scale(1.03);}
.product-name{font-size:18px;margin-bottom:5px;}
.product-price{font-size:16px;font-weight:bold;color:#ffd700;}
.pay-btn{width:100%;background:green;color:white;font-weight:bold;padding:12px;border:none;border-radius:10px;font-size:16px;cursor:pointer;margin-top:10px;}
</style>
</head>
<body>

<div class="header">
  <img src="logo.png" alt="Logo">
  <h1>The Blessed Hats</h1>
  <div class="cart" onclick="toggleCart()">🛒
    <div id="count" class="cart-count">0</div>
  </div>
  <div id="cartDropdown" class="cart-dropdown">
    <div id="cartItems"></div>
    <div class="total">Total: $<span id="cartTotal">0</span></div>
    <button class="pay-btn" onclick="goToCheckout()">Pagar ahora</button>
  </div>
</div>

<div class="container">
  <div class="products">
    <div class="product-card" onclick="location.href='star.html'">
      <img src="star.png" alt="Star Cat">
      <div class="product-name">Star Cat</div>
      <div class="product-price">$850</div>
    </div>
    <div class="product-card" onclick="location.href='good.html'">
      <img src="good.png" alt="Good Demon">
      <div class="product-name">Good Demon</div>
      <div class="product-price">$850</div>
    </div>
    <div class="product-card" onclick="location.href='blessed.html'">
      <img src="blessed.png" alt="Blessed Bandit">
      <div class="product-name">Blessed Bandit</div>
      <div class="product-price">$850</div>
    </div>
    <div class="product-card" onclick="location.href='devil.html'">
      <img src="devil.png" alt="Devil Magic">
      <div class="product-name">Devil Magic</div>
      <div class="product-price">$900</div>
    </div>
  </div>
</div>

<script>
// Carrito
let carrito=JSON.parse(localStorage.getItem("carrito"))||[];

function updateCart(){
  const container=document.getElementById("cartItems");
  const countElem=document.getElementById("count");
  container.innerHTML="";
  let total=0;
  carrito.forEach(item=>{
    total+=item.precio;
    const div=document.createElement("div");
    div.className="cart-item";
    div.innerHTML=`<img src="${item.img}"><span>${item.nombre} $${item.precio}</span>`;
    container.appendChild(div);
  });
  document.getElementById("cartTotal").innerText=total;
  countElem.innerText=carrito.length;
}
updateCart();

function toggleCart(){
  const dropdown=document.getElementById("cartDropdown");
  dropdown.style.display=(dropdown.style.display==='block')?'none':'block';
}
function goToCheckout(){
  window.location.href='checkout.html';
}
</script>

</body>
</html>
