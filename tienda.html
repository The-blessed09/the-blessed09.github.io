<!DOCTYPE html>
<html>
<head>
<title>The Blessed Hats</title>
<style>
body {margin:0;font-family:Arial;background:black;color:white;overflow-x:hidden;}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  justify-content:center; /* centra logo + nombre */
  padding:20px;
  position:relative;
  z-index:100;
}
.hamburger {
  font-size:28px;
  cursor:pointer;
  position:absolute;
  left:20px;
  top:50%;
  transform: translateY(-50%);
  z-index:200;
  color:white;
}
.header img{height:50px;margin-right:10px;}
.header h1{margin:0;font-size:24px;}

/* CARRITO */
.cart{
  position:absolute;
  right:20px;
  font-size:24px;
  cursor:pointer;
  z-index:200;
}
.cart-count{
  position:absolute;
  top:-5px;
  right:-8px;
  background:red;
  color:white;
  font-size:12px;
  padding:2px 6px;
  border-radius:50%;
}
.cart-dropdown{
  display:none;
  position:absolute;
  right:0;
  top:70px;
  width:300px;
  background:rgba(30,30,30,0.9);
  backdrop-filter: blur(8px);
  border-radius:15px;
  padding:10px;
  z-index:150;
}
.cart-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:5px 0;
  border-bottom:1px solid #555;
}
.cart-item img{
  height:40px;
  width:40px;
  object-fit:cover;
  border-radius:5px;
  margin-right:10px;
}
.remove-btn{
  background:red;
  color:white;
  border:none;
  border-radius:50%;
  width:20px;
  height:20px;
  cursor:pointer;
  text-align:center;
  font-weight:bold;
}
.pay-btn{
  margin-top:10px;
  width:100%;
  padding:10px;
  background:green;
  color:white;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
}

/* SIDE MENU */
.side-menu{
  position:fixed;
  left:-300px;
  top:0;
  width:300px;
  height:100%;
  background:black; /* sin gris encima */
  padding:20px;
  transition:0.3s;
  z-index:150;
}
.side-menu h2{margin-top:0;font-size:20px;}
.menu-section{margin-top:20px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.menu-section span.arrow{transition:0.3s;}

/* PRODUCTOS */
.container{max-width:1000px;margin:auto;padding:20px;}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:20px;}
.product-card{background: rgba(30,30,30,0.8);border-radius: 15px;padding: 10px;text-align:center;cursor:pointer;transition:0.3s;}
.product-card img{width:100%;height:200px;object-fit:contain;border-radius:10px;margin-bottom:10px;}
.product-card:hover{transform: scale(1.03);}
.product-name{font-size:18px;margin-bottom:5px;}
.product-price{font-size:16px;font-weight:bold;color:#ffd700;}
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="hamburger" onclick="toggleMenu()">☰</div>
  <img src="logo.png" alt="Logo">
  <h1>The Blessed Hats</h1>
  <div class="cart" onclick="toggleCart()">🛒
    <div id="count" class="cart-count">0</div>
  </div>
  <div id="cartDropdown" class="cart-dropdown">
    <div id="cartItems"></div>
    <div class="total">Total: $<span id="cartTotal">0</span></div>
    <button class="pay-btn" onclick="goToCheckout()">Pagar ahora</button>
  </div>
</div>

<!-- Side Menu -->
<div id="sideMenu" class="side-menu">
  <h2>Menú</h2>
  <div id="mainMenu">
    <div class="menu-section" onclick="showDrops()">
      <span>Drops</span><span class="arrow">→</span>
    </div>
  </div>
  <div id="dropsMenu" style="display:none;">
    <div class="menu-section" onclick="goToDrop('blessed-deity')">
      <span>Blessed Deity</span>
    </div>
  </div>
</div>

<!-- PRODUCTOS -->
<div class="container">
  <div class="products">
    <div class="product-card" onclick="location.href='star.html'">
      <img src="star.png" alt="Star Cat">
      <div class="product-name">Star Cat</div>
      <div class="product-price">$850</div>
    </div>
    <div class="product-card" onclick="location.href='good.html'">
      <img src="good.png" alt="Good Demon">
      <div class="product-name">Good Demon</div>
      <div class="product-price">$850</div>
    </div>
    <div class="product-card" onclick="location.href='blessed.html'">
      <img src="blessed.png" alt="Blessed Bandit">
      <div class="product-name">Blessed Bandit</div>
      <div class="product-price">$850</div>
    </div>
    <div class="product-card" onclick="location.href='devil.html'">
      <img src="devil.png" alt="Devil Magic">
      <div class="product-name">Devil Magic</div>
      <div class="product-price">$900</div>
    </div>
  </div>
</div>

<script>
// Carrito
let carrito=JSON.parse(localStorage.getItem("carrito"))||[];

function updateCart(){
  const container=document.getElementById("cartItems");
  const countElem=document.getElementById("count");
  container.innerHTML="";
  let total=0;
  carrito.forEach((item,index)=>{
    total+=item.precio;
    const div=document.createElement("div");
    div.className="cart-item";
    div.innerHTML=`
      <div style="display:flex;align-items:center;">
        <img src="${item.img}">
        <span>${item.nombre} $${item.precio}</span>
      </div>
      <button class="remove-btn" onclick="removeItem(${index})">×</button>
    `;
    container.appendChild(div);
  });
  document.getElementById("cartTotal").innerText=total;
  countElem.innerText=carrito.length;
}
updateCart();

function removeItem(index){
  carrito.splice(index,1);
  localStorage.setItem("carrito",JSON.stringify(carrito));
  updateCart();
}

function toggleCart(){
  const dropdown=document.getElementById("cartDropdown");
  dropdown.style.display=(dropdown.style.display==='block')?'none':'block';
}
function goToCheckout(){ window.location.href='checkout.html'; }

// Side menu
function toggleMenu(){
  const menu=document.getElementById("sideMenu");
  menu.style.left=(menu.style.left==='0px')?'-300px':'0px';
}
function showDrops(){
  document.getElementById("mainMenu").style.display="none";
  document.getElementById("dropsMenu").style.display="block";
}
function goToDrop(drop){
  window.location.href=drop+'.html';
}
</script>

</body>
</html>
