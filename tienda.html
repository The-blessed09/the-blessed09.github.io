<!DOCTYPE html>
<html>
<head>
<title>The Blessed Hats</title>

<style>
body{margin:0;font-family:Arial;background:black;color:white;}

.header{
position:sticky;top:0;
display:flex;justify-content:space-between;align-items:center;
padding:12px 15px;
backdrop-filter:blur(12px);
background:rgba(20,20,20,0.6);
border-bottom:1px solid rgba(255,255,255,0.1);
}

.left{display:flex;align-items:center;gap:10px;}
.logo{width:32px;}
.brand{font-size:15px;font-weight:bold;}

.cart{position:relative;font-size:22px;cursor:pointer;}
.cart-count{
position:absolute;top:-5px;right:-8px;
background:red;color:white;font-size:12px;
padding:2px 6px;border-radius:50%;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:18px;padding:20px;
}

.card{
background:#0d0d0d;
border-radius:18px;
overflow:hidden;
border:1px solid #1f1f1f;
}

.card img{
width:100%;
height:160px;
object-fit:contain;
background:#111;
padding:15px;
}

.info{padding:15px;text-align:center;}

.modal{
position:fixed;top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.7);
display:none;justify-content:center;align-items:center;
}

.modal-box{
width:90%;max-width:400px;
background:#111;border-radius:20px;
padding:20px;text-align:center;
}
</style>
</head>

<body>

<div class="header">
  <div class="left">
    <img src="logo.png" class="logo">
    <div class="brand">The Blessed Hats</div>
  </div>

  <div class="cart" onclick="abrirCarrito()">
    🛒<div id="cartCount" class="cart-count">0</div>
  </div>
</div>

<div class="grid">

  <div class="card" onclick="location.href='star.html'">
    <img src="Star cat.png">
    <div class="info">Star Cat<br>$850</div>
  </div>

  <div class="card" onclick="location.href='good.html'">
    <img src="Good.png">
    <div class="info">Good Demon<br>$850</div>
  </div>

  <div class="card" onclick="location.href='devil.html'">
    <img src="gorra.png">
    <div class="info">Devil Magic<br>$900</div>
  </div>

  <div class="card" onclick="location.href='blessed.html'">
    <img src="blessed.png">
    <div class="info">Blessed Bandit<br>$850</div>
  </div>

</div>

<div class="modal" id="modal">
<div class="modal-box">
<h2>Carrito</h2>
<div id="items"></div>
<h3 id="total"></h3>

<p>Métodos de pago:<br>
Oxxo | PayPal | MasterCard | Credit Card</p>

<button onclick="cerrar()">Cerrar</button>
</div>
</div>

<script>
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

function guardar(){
localStorage.setItem("carrito", JSON.stringify(carrito));
actualizar();
}

function actualizar(){
document.getElementById("cartCount").innerText = carrito.length;
}

function abrirCarrito(){
let itemsHTML="";
let total=0;

carrito.forEach(p=>{
itemsHTML+=`<p>${p.nombre} - $${p.precio}</p>`;
total+=p.precio;
});

document.getElementById("items").innerHTML=itemsHTML;
document.getElementById("total").innerText="Total: $"+total+" MXN";
document.getElementById("modal").style.display="flex";
}

function cerrar(){
document.getElementById("modal").style.display="none";
}

actualizar();
</script>

</body>
  </html>
