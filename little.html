<!DOCTYPE html>
<html>
<head>
  <title>Little White - The Blessed Hats</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin:0;
      font-family: Arial, sans-serif;
      background:white;
      color:black;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    h1{
      margin-top:30px;
      font-size:22px;
      font-weight:bold;
    }

    .product-img {
      width:280px;
      height:280px;
      object-fit:contain;
      margin-top:20px;
    }

    .product-name {
      font-size:22px;
      margin-top:15px;
      color:grey;
      text-align:center;
    }

    .info-box {
      width:85%;
      max-width:420px;
      background:#f5f5f5;
      border-radius:15px;
      padding:18px;
      margin-top:20px;
      box-shadow:0 4px 8px rgba(0,0,0,0.08);
      font-size:15px;
      line-height:1.6;
    }

    .info-row {
      margin:6px 0;
    }

    .label {
      font-weight:bold;
    }
  </style>
</head>

<body>

  <!-- TÍTULO -->
  <h1>The Blessed Hats</h1>

  <!-- IMAGEN -->
  <img src="little.png" class="product-img">

  <!-- NOMBRE -->
  <div class="product-name">Little White</div>

  <!-- INFO -->
  <div class="info-box">

    <div class="info-row"><span class="label">Drop:</span> Old Black and White</div>
    <div class="info-row"><span class="label">Gorra:</span> Little White</div>
    <div class="info-row"><span class="label">ID:</span> <span id="id">---</span></div>
    <div class="info-row"><span class="label">Serie:</span> <span id="serie">---</span></div>
    <div class="info-row"><span class="label">Escaneos:</span> <span id="scans">0</span></div>
    <div class="info-row"><span class="label">Stock:</span> 4 piezas</div>

  </div>

  <script>
    const validIDs = ["TBH01LW","TBH02LW","TBH03LW","TBH04LW"];

    const params = new URLSearchParams(window.location.search);
    let id = params.get("id");

    if(!validIDs.includes(id)){
      id = "TBH01LW";
    }

    document.getElementById("id").innerText = id;

    const serie = id.replace("TBH","").replace("LW","");
    document.getElementById("serie").innerText = serie.padStart(3,'0');

    let scans = localStorage.getItem(id) || 0;
    scans++;
    localStorage.setItem(id, scans);

    document.getElementById("scans").innerText = scans;
  </script>

</body>
</html>
