<!DOCTYPE html>
<html>
<head>
  <title>Little White - The Blessed Hats</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin:0;
      font-family: Arial, sans-serif;
      background:white;
      color:black;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    h1{
      margin-top:30px;
      font-size:22px;
      font-weight:bold;
    }

    .product-img {
      width:280px;
      height:280px;
      object-fit:contain;
      margin-top:20px;
    }

    .product-name {
      font-size:22px;
      margin-top:15px;
      color:grey;
      text-align:center;
    }

    .info-box {
      width:85%;
      max-width:420px;
      background:#f5f5f5;
      border-radius:18px;
      padding:20px;
      margin-top:25px;
      box-shadow:0 6px 12px rgba(0,0,0,0.12);
      font-size:15px;
      line-height:1.6;
      text-align:center;
    }

    .alert {
      color:red;
      font-weight:bold;
      margin-bottom:10px;
      font-size:16px;
    }

    .drop {
      color:#aaffaa; /* gris fosforescente */
      font-weight:bold;
    }

    .info-row {
      margin:6px 0;
    }
  </style>
</head>

<body>

  <!-- TÍTULO -->
  <h1>The Blessed Hats</h1>

  <!-- IMAGEN -->
  <img src="little.png" class="product-img">

  <!-- NOMBRE -->
  <div class="product-name">Little White</div>

  <!-- INFO -->
  <div class="info-box">

    <div class="alert">⚠️ Posible clonación</div>

    <div class="info-row">Drop: <span class="drop">Old Black and White</span></div>
    <div class="info-row">Gorra: Little White</div>
    <div class="info-row">ID: <span id="id">---</span></div>
    <div class="info-row">Serie: <span id="serie">---</span></div>
    <div class="info-row">Escaneos: <span id="scans">0</span></div>

  </div>

  <script>
    const validIDs = ["TBH01LW","TBH02LW","TBH03LW","TBH04LW"];

    const params = new URLSearchParams(window.location.search);
    let id = params.get("id");

    if(!validIDs.includes(id)){
      id = "TBH01LW";
    }

    document.getElementById("id").innerText = id;

    // Serie formato 01/04
    const numero = id.replace("TBH","").replace("LW","");
    document.getElementById("serie").innerText = numero.padStart(2,'0') + "/04";

    // Contador de escaneos
    let scans = localStorage.getItem(id) || 0;
    scans++;
    localStorage.setItem(id, scans);

    document.getElementById("scans").innerText = scans;
  </script>

</body>
</html>
