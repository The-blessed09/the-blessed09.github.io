<!DOCTYPE html>
<html>
<head>
  <title>Little White - Old Black and White</title>
  <style>
    body {
      margin:0;
      font-family: Arial, sans-serif;
      background:white;
      color:black;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    .product-img {
      width:300px;
      height:300px;
      object-fit:contain;
      margin-top:50px;
    }
    .product-name {
      font-size:24px;
      margin-top:15px;
      color: grey;
    }
    .info-box {
      width: 80%;
      max-width:500px;
      background:#f2f2f2;
      border-radius:15px;
      padding:20px;
      margin-top:20px;
      box-shadow:0 4px 6px rgba(0,0,0,0.1);
      text-align:left;
      font-size:16px;
      line-height:1.5;
    }
    .info-box h3 {
      margin-top:0;
    }
    .info-row {
      margin:5px 0;
    }
  </style>
</head>
<body>

  <!-- Imagen -->
  <img src="little.png" alt="Little White" class="product-img">

  <!-- Nombre -->
  <div class="product-name">Little White</div>

  <!-- Información -->
  <div class="info-box">
    <h3>Información del producto</h3>
    <div class="info-row"><strong>Drop:</strong> Old Black and White</div>
    <div class="info-row"><strong>Gorra:</strong> Little White</div>
    <div class="info-row"><strong>ID:</strong> <span id="productID">---</span></div>
    <div class="info-row"><strong>Número de escaneos:</strong> <span id="scanCount">1</span></div>
    <div class="info-row"><strong>Serie:</strong> <span id="serie">---</span></div>
    <div class="info-row"><strong>Existencia:</strong> 4 piezas</div>
    <div class="info-row"><strong>Extras:</strong> Chip NFC incluido para autenticidad</div>
  </div>

<script>
// IDs válidos
const validIDs = ["TBH01LW","TBH02LW","TBH03LW","TBH04LW"];

// Obtener ID desde URL
const params = new URLSearchParams(window.location.search);
let id = params.get("id");

// Validar ID
if(!validIDs.includes(id)){
  id = "TBH01LW"; // default si no hay o es inválido
}

// Mostrar ID
document.getElementById("productID").innerText = id;

// Serie automática (últimos 2 dígitos)
const serie = id.replace("TBH","").replace("LW","");
document.getElementById("serie").innerText = serie.padStart(3,'0');

// Simulación de escaneos (puedes hacerlo real después)
let scans = localStorage.getItem(id) || 0;
scans++;
localStorage.setItem(id, scans);
document.getElementById("scanCount").innerText = scans;
</script>

</body>
</html>
