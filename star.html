<!DOCTYPE html>
<html>
<head>
<title>Star cat</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
  text-align:center;
}

/* HEADER */
.header{
  padding:20px;
  font-size:24px;
  font-weight:bold;
}

/* IMAGEN PRINCIPAL */
.main-img{
  width:80%;
  border-radius:20px;
}

/* GALERÍA */
.gallery{
  margin-top:15px;
}

.gallery img{
  width:70px;
  margin:5px;
  border-radius:10px;
  cursor:pointer;
  transition:0.2s;
}

.gallery img:hover{
  transform:scale(1.1);
}

/* BOTONES */
button{
  margin:10px;
  padding:15px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

.buy{
  background:#00cfff;
  color:black;
}

.cart{
  background:white;
}
</style>
</head>

<body>

<div class="header">Star cat</div>

<!-- IMAGEN PRINCIPAL (FRONTAL) -->
<img id="mainImage" src="star1.png" class="main-img">

<!-- GALERÍA (5 IMÁGENES) -->
<div class="gallery">
  <img src="star1.png" onclick="changeImage(this)">
  <img src="star2.png" onclick="changeImage(this)">
  <img src="star3.png" onclick="changeImage(this)">
  <img src="star4.png" onclick="changeImage(this)">
  <img src="star5.png" onclick="changeImage(this)">
</div>

<p>Gorra premium edición Blessed Deity</p>

<h2>$850 MXN</h2>

<button class="buy">Comprar ahora</button>
<button class="cart">Añadir al carrito</button>

<script>
function changeImage(img){
  document.getElementById("mainImage").src = img.src;
}
</script>

</body>
</html>
