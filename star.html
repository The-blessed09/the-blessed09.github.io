<!DOCTYPE html>
<html>
<head>
<title>Star cat</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
  text-align:center;
}

/* HEADER */
.header{
  padding:20px;
  font-size:24px;
  font-weight:bold;
}

/* CONTENEDOR (RECTÁNGULO) */
.box{
  width:90%;
  max-width:400px;
  margin:30px auto;
  background:#111;
  border-radius:20px;
  padding:15px;
  box-shadow:0 0 20px rgba(255,255,255,0.1);
}

/* CARRUSEL */
.carousel{
  display:flex;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  border-radius:15px;
}

.carousel img{
  width:100%;
  height:300px;
  object-fit:cover;
  flex-shrink:0;
  scroll-snap-align:center;
  border-radius:15px;
}

/* TEXTO */
p{
  margin-top:20px;
}

.price{
  font-size:22px;
  margin:10px 0;
}

/* BOTONES */
button{
  margin:10px;
  padding:15px;
  border:none;
  border-radius:10px;
  font-size:16px;
}

.buy{
  background:#00cfff;
  color:black;
}

.cart{
  background:white;
}
</style>
</head>

<body>

<div class="header">Star cat</div>

<!-- 🔥 RECTÁNGULO CENTRADO -->
<div class="box">

  <!-- CARRUSEL -->
  <div class="carousel">
    <img src="star1.png">
    <img src="star2.png">
    <img src="star3.png">
    <img src="star4.png">
  </div>

</div>

<p>Gorra premium edición Blessed Deity</p>

<div class="price">$850 MXN</div>

<button class="buy">Comprar ahora</button>
<button class="cart">Añadir al carrito</button>

</body>
  </html>
