<!DOCTYPE html>
<html>
<head>
<title>Star Cat</title>

<style>
body{margin:0;font-family:Arial;background:black;color:white;text-align:center;}

.header{
position:sticky;top:0;
display:flex;justify-content:space-between;align-items:center;
padding:12px 15px;
backdrop-filter:blur(12px);
background:rgba(20,20,20,0.6);
}

.cart{position:relative;font-size:22px;}
.cart-count{
position:absolute;top:-5px;right:-8px;
background:red;color:white;font-size:12px;
padding:2px 6px;border-radius:50%;
}

.box{
width:90%;margin:20px auto;
background:#111;border-radius:20px;padding:20px;
}

.carousel{
display:flex;overflow-x:auto;
}

.carousel img{
width:100%;height:350px;
object-fit:contain;
}

button{
padding:15px;margin:10px;
border:none;border-radius:10px;
}
</style>
</head>

<body>

<div class="header">
<div>The Blessed Hats</div>
<div class="cart" onclick="abrirCarrito()">
🛒<div id="cartCount" class="cart-count">0</div>
</div>
</div>

<h2>Star Cat</h2>

<div class="box">

<div class="carousel">
<img src="star1.png">
<img src="star2.png">
<img src="star3.png">
<img src="star4.png">
</div>

<h3>$850 MXN</h3>

<button onclick="agregar()">Añadir al carrito</button>

</div>

<div class="modal" id="modal" style="display:none;">
<div class="box">
<h2>Carrito</h2>
<div id="items"></div>
<h3 id="total"></h3>
<button onclick="cerrar()">Cerrar</button>
</div>
</div>

<script>
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

function actualizar(){
document.getElementById("cartCount").innerText = carrito.length;
}

function agregar(){
carrito.push({nombre:"Star Cat",precio:850});
localStorage.setItem("carrito", JSON.stringify(carrito));
actualizar();
alert("Añadido al carrito");
}

function abrirCarrito(){
let html="", total=0;
carrito.forEach(p=>{
html+=`<p>${p.nombre} - $${p.precio}</p>`;
total+=p.precio;
});
document.getElementById("items").innerHTML=html;
document.getElementById("total").innerText="Total: $"+total;
document.getElementById("modal").style.display="block";
}

function cerrar(){
document.getElementById("modal").style.display="none";
}

actualizar();
</script>

</body>
</html>
