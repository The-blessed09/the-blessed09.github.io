<!DOCTYPE html>
<html>
<head>
<title>Good Demon</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:black;
  color:white;
  text-align:center;
}

/* HEADER GLASS */
.header{
  position:sticky;
  top:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 15px;
  backdrop-filter:blur(12px);
  background:rgba(20,20,20,0.6);
  border-bottom:1px solid rgba(255,255,255,0.1);
}

.cart{
  position:relative;
  font-size:22px;
  cursor:pointer;
}

.cart-count{
  position:absolute;
  top:-5px;
  right:-8px;
  background:red;
  color:white;
  font-size:12px;
  padding:2px 6px;
  border-radius:50%;
}

/* CAJA PRODUCTO */
.box{
  width:90%;
  margin:20px auto;
  background:#111;
  border-radius:20px;
  padding:20px;
}

/* GALERÍA */
.carousel{
  display:flex;
  overflow-x:auto;
  gap:10px;
}

.carousel img{
  width:100%;
  height:350px;
  object-fit:contain;
  border-radius:10px;
  background:#000;
}

/* BOTONES */
button{
  padding:15px;
  margin:10px;
  border:none;
  border-radius:10px;
  font-size:14px;
}

.add{
  background:#00c2ff;
  color:black;
}

.buy{
  background:white;
}

/* MODAL */
.modal{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.7);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-box{
  width:90%;
  max-width:400px;
  background:#111;
  border-radius:20px;
  padding:20px;
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
  <div>The Blessed Hats</div>

  <div class="cart" onclick="abrirCarrito()">
    🛒
    <div id="cartCount" class="cart-count">0</div>
  </div>
</div>

<h2>Good Demon</h2>

<!-- PRODUCTO -->
<div class="box">

  <div class="carousel">
    <img src="good1.png">
    <img src="good2.png">
    <img src="good3.png">
    <img src="good4.png">
  </div>

  <h3>$850 MXN</h3>

  <button class="add" onclick="agregar()">Añadir al carrito</button>
  <button class="buy" onclick="abrirCarrito()">Comprar ahora</button>

</div>

<!-- MODAL CARRITO -->
<div class="modal" id="modal">
  <div class="modal-box">

    <h2>Carrito</h2>
    <div id="items"></div>
    <h3 id="total"></h3>

    <p>
      Métodos de pago:<br>
      Oxxo | PayPal | MasterCard | Credit Card
    </p>

    <button onclick="cerrar()">Cerrar</button>

  </div>
</div>

<script>
let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

function actualizar(){
  document.getElementById("cartCount").innerText = carrito.length;
}

function agregar(){
  carrito.push({nombre:"Good Demon", precio:850});
  localStorage.setItem("carrito", JSON.stringify(carrito));
  actualizar();
  alert("Añadido al carrito");
}

function abrirCarrito(){
  let html="";
  let total=0;

  carrito.forEach(p=>{
    html += `<p>${p.nombre} - $${p.precio}</p>`;
    total += p.precio;
  });

  document.getElementById("items").innerHTML = html;
  document.getElementById("total").innerText = "Total: $" + total + " MXN";

  document.getElementById("modal").style.display = "flex";
}

function cerrar(){
  document.getElementById("modal").style.display = "none";
}

actualizar();
</script>

</body>
</html>
