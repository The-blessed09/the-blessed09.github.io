<!DOCTYPE html>
<html>
<head>
  <title>The Blessed Hats</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">

  <style>
    body {
      margin:0;
      font-family:Arial;
      background:white;
      color:black;
      text-align:center;
      overflow-x:hidden;
    }

    .header { font-size:42px; font-weight:bold; padding:25px; }

    .imagen { 
      height:800px; 
      display:flex; 
      align-items:center; 
      justify-content:center; 
    }

    .img-gorra { 
      width:100%; 
      max-width:1500px; 
      height:auto; 
    }

    .titulo-gorra {
      font-family:'Cinzel Decorative', serif;
      font-size:50px;
      font-weight:bold;
      margin-top:20px;
      margin-bottom:25px;
      letter-spacing:4px;
      white-space:nowrap;
    }

    .box {
      position:fixed;
      bottom:320px;
      left:50%;
      transform:translateX(-50%);
      border:2px solid black;
      border-radius:30px;
      padding:60px;
      width:95%;
      max-width:650px;
      background:white;
      box-shadow:0 12px 35px rgba(0,0,0,0.25);
    }

    .ok { font-size:28px; margin-bottom:20px; font-weight:bold; }
    .nombre { font-size:26px; margin-bottom:15px; }
    .serie { font-size:22px; margin-bottom:15px; }
    .scans { font-size:24px; color:#333; }

    .drop {
      font-size:24px;
      margin-bottom:18px;
      letter-spacing:1px;
      color:black;
    }

    .drop-nombre {
      color:#d4af37;
      font-weight:bold;
    }

    .star { color:#FF69B4; }
    .cat { color:#87CEFA; }

    @keyframes caer {
      0% { transform:translateY(0); opacity:1; }
      100% { transform:translateY(100vh); opacity:0; }
    }

  </style>
</head>
<body>

<div class="header">The Blessed Hats</div>

<div class="imagen">
  <img src="" class="img-gorra" id="imgGorra">
</div>

<div class="titulo-gorra" id="tituloGorra"></div>

<div class="box">
  <div class="ok" id="autenticado"></div>

  <div class="drop">
    Drop: <span class="drop-nombre">Blessed Deity</span>
  </div>

  <div class="nombre">Gorra: <span id="nombre"></span></div>
  <div class="serie">Serie: <span id="serie"></span></div>
  <div class="scans">Escaneos: <span id="scans">0</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyD9pRqLGAhEFIjueCK6PxWXFxWb_tnUBcg",
  authDomain: "autenticidad-8dad7.firebaseapp.com",
  projectId: "autenticidad-8dad7",
  storageBucket: "autenticidad-8dad7.firebasestorage.app",
  messagingSenderId: "613750291310",
  appId: "1:613750291310:web:d6eeacf20efd1e2ee05f7f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const gorras = {
  // DEVIL MAGIC
  "TBH01DM": { nombre:"Devil Magic", img:"gorra.png", color:"#FF0000", serie:"01/04" },
  "TBH02DM": { nombre:"Devil Magic", img:"gorra.png", color:"#FF0000", serie:"02/04" },
  "TBH03DM": { nombre:"Devil Magic", img:"gorra.png", color:"#FF0000", serie:"03/04" },
  "TBH04DM": { nombre:"Devil Magic", img:"gorra.png", color:"#FF0000", serie:"04/04" },

  // BLESSED BANDIT
  "TBH01BB": { nombre:"Blessed bandit", img:"blessed.png", color:"#FF69B4", serie:"01/04" },
  "TBH02BB": { nombre:"Blessed bandit", img:"blessed.png", color:"#FF69B4", serie:"02/04" },
  "TBH03BB": { nombre:"Blessed bandit", img:"blessed.png", color:"#FF69B4", serie:"03/04" },
  "TBH04BB": { nombre:"Blessed bandit", img:"blessed.png", color:"#FF69B4", serie:"04/04" },

  // GOOD DEMON
  "TBH01GD": { nombre:"Good Demon", img:"Good.png", color:"#FF69B4", serie:"01/04" },
  "TBH02GD": { nombre:"Good Demon", img:"Good.png", color:"#FF69B4", serie:"02/04" },
  "TBH03GD": { nombre:"Good Demon", img:"Good.png", color:"#FF69B4", serie:"03/04" },
  "TBH04GD": { nombre:"Good Demon", img:"Good.png", color:"#FF69B4", serie:"04/04" },

  // STAR CAT
  "TBH01SC": { nombre:"Star cat", img:"Star cat.png", serie:"01/04" },
  "TBH02SC": { nombre:"Star cat", img:"Star cat.png", serie:"02/04" },
  "TBH03SC": { nombre:"Star cat", img:"Star cat.png", serie:"03/04" },
  "TBH04SC": { nombre:"Star cat", img:"Star cat.png", serie:"04/04" }
};

if(!id || !gorras[id]) {
  document.querySelector(".box").innerHTML = "<h2>ID inválido ❌</h2>";
} else {
  const dataGorra = gorras[id];

  document.getElementById("imgGorra").src = dataGorra.img;

  if(dataGorra.nombre === "Star cat"){
    document.getElementById("tituloGorra").innerHTML =
      '<span class="star">Star</span> <span class="cat">cat</span>';

    for(let i=0;i<15;i++){
      const emoji = document.createElement("div");
      emoji.innerText = Math.random() > 0.5 ? "🌌" : "🐾";
      emoji.style.position = "fixed";
      emoji.style.left = Math.random()*100 + "%";
      emoji.style.top = "-50px";
      emoji.style.fontSize = "30px";
      emoji.style.animation = "caer 4s linear infinite";
      document.body.appendChild(emoji);
    }

  } else {
    document.getElementById("tituloGorra").innerText = dataGorra.nombre;
    document.getElementById("tituloGorra").style.color = dataGorra.color;
  }

  document.getElementById("nombre").innerText = dataGorra.nombre;
  document.getElementById("serie").innerText = dataGorra.serie;

  const ref = doc(db, "gorras", id);
  getDoc(ref).then(snap=>{
    if(snap.exists()) {
      const scansActual = snap.data().scans || 0;

      if(scansActual > 20){
        document.getElementById("autenticado").innerText = "⚠️ Posible clonación";
        document.getElementById("autenticado").style.color = "red";
      } else {
        document.getElementById("autenticado").innerText = "✔ Autenticado por The Blessed Hats";
      }

      updateDoc(ref,{scans: increment(1)});
      document.getElementById("scans").innerText = scansActual + 1;
    }
  });
}
</script>

</body>
</html>
