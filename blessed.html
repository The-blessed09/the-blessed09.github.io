<!DOCTYPE html>
<html>
<head>
<title>Blessed Bandit</title>

<style>
body{margin:0;font-family:Arial;background:black;color:white;text-align:center;}
.header{padding:25px 0;font-size:28px;font-weight:bold;}

.box{width:95%;max-width:600px;margin:20px auto;background:#111;border-radius:25px;padding:25px;}

.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;}
.carousel img{width:100%;height:420px;object-fit:cover;}

.price{font-size:28px;margin:15px 0;font-weight:bold;}

.qty-box{display:flex;justify-content:center;gap:15px;margin:15px 0;}
.qty-btn{width:45px;height:45px;font-size:22px;border:none;border-radius:10px;background:white;}

button{width:90%;padding:18px;margin:10px auto;border:none;border-radius:15px;font-size:18px;display:block;}
.buy{background:#00cfff;color:black;}
.cart{background:white;color:black;}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.card{background:#111;border-radius:15px;padding:10px;}
.card img{width:100%;height:120px;object-fit:cover;border-radius:10px;}
</style>
</head>

<body>

<div class="header">Blessed Bandit</div>

<div class="box">

<div class="carousel">
<img src="blessed1.png">
<img src="blessed2.png">
<img src="blessed3.png">
<img src="blessed4.png">
</div>

<div class="price">$850 MXN</div>

<div class="qty-box">
<button onclick="menos()">-</button>
<div id="cantidad">1</div>
<button onclick="mas()">+</button>
</div>

<button class="buy">Comprar ahora</button>
<button class="cart">Añadir al carrito</button>

</div>

<div class="info">
<h3>Más productos...</h3>

<div class="grid">
<div onclick="location.href='star.html'" class="card">
<img src="Star cat.png"><p>Star Cat</p><p>$850</p>
</div>

<div onclick="location.href='good.html'" class="card">
<img src="Good.png"><p>Good Demon</p><p>$850</p>
</div>

<div onclick="location.href='devil.html'" class="card">
<img src="gorra.png"><p>Devil Magic</p><p>$900</p>
</div>
</div>

</div>

<script>
let c=1;
function mas(){if(c<4){c++;cantidad.innerText=c;}}
function menos(){if(c>1){c--;cantidad.innerText=c;}}
</script>

</body>
</html>
